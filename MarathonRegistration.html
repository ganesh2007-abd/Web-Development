<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Registration</title>
</head>

<body>
    <form action="/dummy">
        <label for="fname">FisrtName</label>
        <input type="text" id="fname">

        <label for="lname">LastName</label>
        <input type="text" id="lname">

        <p>Select a Race</p>

        <input type="radio" name="Race" id="5k" value="5k">
        <label for="5k">Fun Run 5k</label>
        <br>
        <input type="radio" name="Race" id="half" value="half">
        <label for="half">Half Marathon</label>
        <br>
        <input type="radio" name="Race" id="full" value="full">
        <label for="full">Full Marathon</label>
        <br>
        <label for="mail">Email</label>
        <input type="email" id="mail">
        <label for="pass">Password</label>
        <input type="password" id="password">
        <br>
        <label for="age">Select Age Group</label>
        <select name="age" id="age">
            <option value="lt18">under 18</option>
            <option value="18-30">18-30</option>
            <option value="30-60">30-60</option>
            <option value="60+">60+</option>
        </select>
        <br>
        <button>Register</button>

    </form>
</body>

</html>
