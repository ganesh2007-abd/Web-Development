<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
        integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <title>Buttons</title>
</head>

<body>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
        integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
        integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
        crossorigin="anonymous"></script>

    <div class="container">
        <button class="btn">Submit</button>
        <button class="btn btn-primary">Submit</button>
        <button class="btn btn-outline-success">Submit</button>
        <button class="btn btn-info btn-lg">Submit</button>
        <button class="btn btn-info btn-sm">Submit</button>
        <button class="btn btn-secondary btn-block">Submit</button>
        <button class="btn btn-secondary btn-block" disabled>Submit</button>
        <a href="" class="btn disabled btn-warning" role="button">Submit</a>
        <!--a tag wont have disabled attribute so we add disabled class -- role=button should be added to <a> tags to avoud collapse-->
        <input type="submit" class="btn btn-danger">
        <div class="btn-group-toggle" data-toggle="buttons">
            <label class="btn btn-secondary active">
                <input type="checkbox" checked>Checked
            </label>
        </div>
        <div class="btn-group btn-group-toggle" data-toggle="buttons">
            <label for="" class="btn btn-primary active">
                <input type="radio" name="options" id="option1" checked>Active
            </label>
            <label for="" class="btn btn-primary active">
                <input type="radio" name="options" id="option1">Radio
            </label>
            <label for="" class="btn btn-primary active">
                <input type="radio" name="options" id="option1">Radio
            </label>
        </div>
    </div>
</body>

</html>
